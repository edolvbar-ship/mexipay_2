<form (submit)="$event.preventDefault()" class="flex items-center">
    <div class="relative w-full text-black">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
            <i class="pi pi-search"></i>
        </div>
        <input 
            #inputSearch
            (keydown)="preventEvent($event)"
            type="text" 
            id="simple-search" 
            class="border-[1px] border-light-gray rounded-full w-full ps-10 p-2.5 focus:ring-0 !ring-0 focus:outline-primary h-8 placeholder:text-sm" 
            placeholder="Buscar" 
        />
    </div>
</form>
