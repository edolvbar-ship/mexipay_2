<div class="mb-7">
    <text-title
        class="capitalize "
        text={{title}}
        size="large" 
        variant="primary">
    </text-title>
    <div class="flex flex-col md:flex-row md:justify-between space-y-4 md:space-y-0 md:space-x-4">
        <text-type
            text={{subHead}} 
            size="large" 
            variant="primary">
        </text-type>
        <div 
        class="justify-items-end">
        <ng-content>

        </ng-content>
        </div>
        <action-button
            *ngIf="textBtn && canCreate" 
            text={{textBtn}}
            [linkText]="linkText"
            [linkIcon]="icon">
        </action-button>
    </div>
</div>
