<section-title title="Movimientos - Transacciones"></section-title>

<div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mb-4 ">

    <div *ngIf="!isLoading" class="">
        <card-dounut-chart [title]="'Total de Transacciones'" [subTitle]="'Total de rango'"
            [infoChart]="donutInfoChartTxt">
        </card-dounut-chart>
    </div>
    <div class="" *ngIf="!isLoading">
        <card-dounut-chart  [title]="'Tipo de Tarjeta'" [subTitle]="'Total de rango'"
        [infoChart]="donutInfoChartCardType">
        </card-dounut-chart>
    </div>
    <div class="" *ngIf="!isLoading">
        <card-dounut-chart  [title]="'Marca de Tarjeta'" [subTitle]="'Total de rango'"
        [infoChart]="donutInfoChartAccountType">
        </card-dounut-chart>
    </div>

    <div class="justify-center items-center content-center lg:col-span-3 xl:col-span-1">
        <div class="flex justify-center gap-4 xl:flex-col 2xl:flex-row [@media(min-width:1720px)]:flex-row">
            <div class="flex justify-center items-center">
              <app-calendar [rangeDates]="initialDates" (dateEmitted)="handleDates($event)"></app-calendar>
            </div>

            <div class="flex justify-center items-center">
                <action-button class="w-fit" (click)="exportToExcel()" [text]="'Exportar XLSX'" [linkIcon]="'DOWNLOAD'">
                </action-button>
            </div>
            <div class="flex justify-center items-center">
                <action-button class="w-fit" (click)="exportToPDF()" [text]="'Exportar PDF'" [linkIcon]="'DOWNLOAD'">
                </action-button>
            </div>
        </div>
    </div>
</div>

<card-container>
    <!-- Loading indicator -->
    <div *ngIf="isLoading && !isLoadingMore" class="flex justify-center p-4">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
    </div>

    <!-- Data count and page info -->
    <div *ngIf="!isLoading" class="mb-4 px-4">
        <div class="flex justify-between items-center">
            <div class="text-sm text-gray-600">
                Mostrando {{ movementsTableFiltered?.length || 0 }} de {{ totalItems }} transacciones
            </div>
            <div *ngIf="totalPages > 1" class="text-sm text-gray-600">
                Página {{ currentPage }} de {{ totalPages }}
            </div>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
            <div class="bg-blue-600 h-2.5 rounded-full"
                 [style.width]="(movementsTableFiltered?.length / totalItems * 100) + '%' || '0%'">
            </div>
        </div>
    </div>

    <!-- Loading overlay -->
    <div *ngIf="isLoading" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <div class="flex items-center space-x-4">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                <span class="text-gray-700">Cargando transacciones...</span>
            </div>
        </div>
    </div>

    <table-layout
        [dataTable]="isLoading ? [] : movementsTableFiltered"
        [columnsWithSum]="columnsWithSum"
        [filter]="true"
        [hiddenColumns]="['Tipo Entrada']"
    >
        <div firstFIeld class="flex items-center">
            <div>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" value="" class="sr-only peer"
                    id="liquidations"
                    #checkboxRef
                    (change)="changeLiquidatibs()"
                    >
                    <span class="ms-3 text-sm font-medium mr-4">Transacciones</span>
                    <div class="relative w-6 h-4 border border-2 border-light-gray peer-focus:outline-none peer-focus:ring-primary dark:peer-focus:ring-primary rounded-full peer dark:bg-light-gray peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:bg-primary after:border-gray after:border after:rounded-full after:h-3 after:w-3 peer-checked:after:bg-primary after:bg-primary after:transition-all dark:border-light-gray peer-checked:bg-light-gray peer:bg-primary"></div>
                    <span class="ms-3 text-sm font-medium mr-4">Liquidaciones</span>
                </label>
            </div>
        </div>
    </table-layout>

    <!-- Load More Button -->
    <div *ngIf="!isLoading && !allDataLoaded && movementsTableFiltered?.length > 0" class="mt-4 flex justify-center">
        <button
            (click)="loadMoreData()"
            [disabled]="isLoadingMore"
            class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed flex items-center"
        >
            <span *ngIf="!isLoadingMore">Cargar más transacciones</span>
            <span *ngIf="isLoadingMore" class="flex items-center">
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Cargando...
            </span>
        </button>
    </div>

    <!-- All data loaded message -->
    <div *ngIf="allDataLoaded && movementsTableFiltered?.length > 0" class="mt-4 text-center text-sm text-gray-500">
        Has cargado todas las transacciones disponibles
    </div>
</card-container>
