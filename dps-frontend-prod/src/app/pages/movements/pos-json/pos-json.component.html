<section-title title="POS JSON" subHead="Detalle de transacción POS JSON"></section-title>
<card-container>
    <table-layout 
    [dataTable]="movementsTable"
    [actions]="actions"
    [showActions]="true" 
    [filter]="true"
    >
    <div firstFIeld class="mr-8">
            <app-calendar #calendarRef [rangeDates]="initialDates" (dateEmitted)="handleDates($event)"></app-calendar>   
    </div>
    <div secondFIeld class="ml-8"> 
        <action-button
            (click)="exportToExcel()"
            [text]="'Exportar'"
            [linkIcon]="'DOWNLOAD'"
        ></action-button>
    </div>
    </table-layout>
</card-container>
