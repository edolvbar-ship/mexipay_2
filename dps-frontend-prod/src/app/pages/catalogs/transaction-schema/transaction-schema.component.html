<section-title
    title="Esquemas transaccionales"
    textBtn="Nuevo esquema"
    [linkText]="linkNewRow"
    [canCreate]="canCreate"
    >
</section-title>
<card-container>
    <table-layout 
        [dataTable]="transacSchemData"
        [actions]="actions" 
        [showActions]="true" 
        [actionsColumnIndex]="2"
        [filter]="true"
        >    
    </table-layout>
</card-container>
<modal-confirm
  (accept)="handleReject()" 
  (reject)="handleAccept()">
</modal-confirm>
