<section-title
    [title]="sectionTitle"
    textBtn="Regresar"
    [linkText]="linkText"
    [icon]="'UNDO'"
    [canCreate]="true"
    >
</section-title>
<card-container class="grid w-full">
    <div class="mb-6 flex items-center justify-between">
        <text-title text="" size="xsmall" variant="secondary">
        </text-title>
        <div></div>
    </div>
    <form (submit)="$event.preventDefault()" action="" class="grid md:grid-cols-6 gap-x-24" [formGroup]="formGroup">
    
        <div class="col-span-1">
            <app-input-text
                id="mode"
                label="Modo:"
                [maxlength]="3"
                [formControlName]="'mode'"
            >
            </app-input-text>
        </div>

        <div class="col-span-5">
            <app-input-text
                id="description"
                label="Descripción:"
                [maxlength]="50"
                [formControlName]="'description'"
            >
            </app-input-text>
        </div>
        
        <div class="col-span-6 flex justify-end">
            <action-button
                (click)="saveForm()"
                class="mt-6"
                text="Guardar"
                [linkIcon]="'SAVE'">
            </action-button>
        </div>
    </form>
</card-container>
