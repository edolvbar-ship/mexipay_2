<section-title
    [title]="sectionTitle"
    textBtn="Regresar"
    [linkText]="linkText"
    [canCreate]="true"
    [icon]="'UNDO'"
    >
</section-title>
<card-container class="grid w-full">
    <div class="mb-6 flex items-center justify-between">
        <text-title text="Información de Banco Adquirente" size="xsmall" variant="secondary">
        </text-title>
        <div>
            
        </div>
    </div>
    <form (submit)="$event.preventDefault()" action="" class="grid md:grid-cols-6 gap-x-24" [formGroup]="formGroup">
        <div class="col-span-2">
            <app-input-text
                id="fiid"
                label="FIID:"
                [maxlength]="4"
                [formControlName]="'fiid'"
            >
            </app-input-text>
        </div>

        <div class="col-span-4">
            <app-input-text
                id="name"
                label="Nombre:"
                [maxlength]="50"
                [formControlName]="'name'"
            >
            </app-input-text>
        </div>
        
        <div class="col-span-6 flex justify-end">
            <action-button
                (click)="saveForm()"
                class="mt-6"
                text="Guardar"
                [linkIcon]="'SAVE'">
            </action-button>
        </div>
    </form>
</card-container>
