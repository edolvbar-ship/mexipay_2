<section-title
    title="Listado de Red Procesador"
    textBtn="Nuevo procesador"
    [linkText]="linkNewRow"
    [canCreate]="canCreate"
    >
</section-title>
<card-container>
    <table-layout 
        [dataTable]="processorsData"
        [actions]="actions" 
        [showActions]="true" 
        [actionsColumnIndex]="2"
        [filter]="true"
        >    
    </table-layout>
</card-container>
<modal-confirm
  (accept)="handleReject()" 
  (reject)="handleAccept()">
</modal-confirm>
