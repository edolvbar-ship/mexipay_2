<section-title
    title="Listado de Perfiles Transaccionales"
    textBtn="Nuevo perfil"
    [linkText]="linkNewRow"
    [canCreate]="canCreate"
    >
</section-title>
<card-container>
    <table-layout 
        [dataTable]="transactionalProfileData"
        [actions]="actions" 
        [showActions]="true" 
        [actionsColumnIndex]="2"
        [filter]="true"
        >    
    </table-layout>
</card-container>
<modal-confirm
    (accept)="handleReject()" 
    (reject)="handleAccept()">
</modal-confirm>
