<div class="h-1">
</div>
<div class="max-w-xl mx-auto px-12">
    <div class="content-center flex flex-col select-none">
        <div class="mb-12">
            <text-title text="¿Olvidaste tu contraseña?" size="xlarge" variant="primary">
            </text-title>
            <text-type
                text="¡No te preocupes! Ingresa el nombre de usuario vinculado a tu cuenta."
                size="xlarge"
                variant="primary"
                class="text-center"
            >
            </text-type>
        </div>
        <div>
    <!-- <input-login-form
        text="h-9"
        placeholder="text"
        >
    </input-login-form>
    <input-login-form></input-login-form> -->
            <div class="flex flex-col">
                <div class="top-0 mb-12">
                    <label class="h-full flex items-center mb-6">
                        <text-type text="Nombre de usuario" size="xlarge" variant="primary">
                        </text-type>
                    </label>
                    <div class="relative">
                        <input
                            [(ngModel)]="user"
                            type="text"
                            class="block h-full rounded-t-lg pl-10 pr-4 py-2 w-full text-base text-black border-0 border-b-2 border-gray appearance-none focus:outline-none focus:ring-0 focus:border-primary"
                            placeholder="Ingresa tu nombre de usuario"
                            required/>
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                            <i class="pi pi-user"></i>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div class="mb-4">
            <default-button
                (click)="getPassword()"
                text="Enviar e-mail">
            </default-button>
        </div>
        <div class="inline-block">
            <text-type
                text="¿Ya tienes una cuenta?"
                size="xlarge"
                variant="primary"
                class="text-center">
            </text-type>
            <a routerLink="/login">
                <text-type
                    text="¡Ingresa aquí!"
                    size="xlarge"
                    variant="secondary"
                    class="text-center">
                </text-type>
            </a>
        </div>
    </div>
</div>
