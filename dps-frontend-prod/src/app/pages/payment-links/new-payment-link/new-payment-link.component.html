<section-title
    title="Links de Pago">
</section-title>
<div class="flex gap-8 w-full">
    <card-container class="w-1/2">
        <div class="mb-8">
            <text-title
                text="¡Listo! Ya puedes compartir el Link"
                size="medium">

            </text-title>
            <text-type text="Envía tu Link de Pago a tus clientes y recibe de manera fácil y rápida tus pagos."></text-type>
        </div>
        <div class="text-center mb-8">
            <text-type text="Total de pago" variant="secondary" size="medium"></text-type>
            <span class="text-5xl font-bold">$12.00</span>
            <div class="flex justify-center">
                <hr class="border-light-gray w-1/2 border-gray">
            </div>
        </div>
        <div class="flex items-center justify-start h-12 bg-light-primary w-full mb-12">
            <text-type text="Link de Pago" variant="secondary" size="medium" class="m-4"></text-type>
            <span class="flex items-center m-14">
                <img class="h-5 mr-4" src="'../../../../../../assets/core-icons/ico-copy.svg" alt="">
                <text-type text="https://linkdeprueba.com" size="xlarge"></text-type>
            </span>
        </div>
        <div class="flex justify-between">
            <div>
                <text-type text="Link de Pago" variant="secondary" size="medium" class=""></text-type>
                <span class="flex items-center gap-2">
                    <div class="size-2 bg-yellow rounded-full"></div>
                    <text-type text="En Espera" class="font-bold"></text-type>
                </span>
            </div>
            <div>
                <text-type text="Producto o Servicio" variant="secondary" size="medium"></text-type>
                <text-type text="Lorep ipsum"></text-type>
            </div>
            <div>
                <text-type text="Fecha de Vencimiento" variant="secondary" size="medium"></text-type>
                <text-type text="11 - Nov - 2023"></text-type>
            </div>
        </div>
    </card-container>
    <card-container class="w-1/2 flex content-between">
        <div>
            <text-type text="Puedes compartir el Link de las siguientes maneras:"></text-type>
        </div>
        <div class="flex gap-4 justify-center items-center">
            <button
                class="flex items-center justify-center h-8 rounded-full min-w-32 px-4 font-medium text-[15px] border-[1px] border-black"
                type="submit">
                WhatsApp
                <img src="../../../../assets/core-icons/ico-whatsapp.svg"  class="ml-2 w-4 h-4">
            </button>
            <button
                class="flex items-center justify-center h-8 rounded-full min-w-32 px-4 font-medium text-[15px] border-[1px] border-black"
                type="submit">
                Email
                <img src="../../../../assets/core-icons/ico-email-black.svg"  class="ml-2 w-4 h-4">
            </button>
            <button
                class="flex items-center justify-center h-8 rounded-full min-w-32 px-4 font-medium text-[15px] border-[1px] border-black"
                type="submit">
                SMS
                <img src="../../../../assets/core-icons/ico-sms.svg"  class="ml-2 w-4 h-4">
            </button>
        </div>
        <div>
            <div></div>
        </div>

    </card-container>
