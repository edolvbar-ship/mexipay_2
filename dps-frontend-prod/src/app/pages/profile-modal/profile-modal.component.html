<app-modal-content [visible]="isVisible" (visibleChange)="closeModal()">
    <div dialogContent>
        <div class="flex flex-grow gap-8">
            <div class="h-full flex flex-col items-center justify-between">
                <div class="bg-primary size-32 rounded-full mb-4 flex items-center justify-center text-center">
                    <text-type [text]="userCapital" class="text-6xl font-bold" [variant]="'tertiary'"></text-type>
                </div>                
            
                <form (submit)="$event.preventDefault()" [formGroup]="formGroup" class="flex flex-col gap-4 w-full items-center">
                    <app-input-text 
                        [label]="'Nombre'" 
                        [maxlength]="30" 
                        formControlName="name">
                    </app-input-text>
                    <app-input-text 
                        [label]="'Apellido'" 
                        [maxlength]="30" 
                        formControlName="lastName">
                    </app-input-text>
                </form>
            </div>
            

            <div class="w-full h-full flex flex-col">
                <form (submit)="$event.preventDefault()" [formGroup]="formGroup" class="flex flex-col h-full justify-between gap-4 mb-8">
                    <div class="flex flex-col gap-2">
                        <text-type [text]="'Información'" [variant]="'secondary'"></text-type>
                        <div class="flex flex-grow gap-4">
                            <app-input-text 
                                class="min-w-64"
                                [label]="'Correo Electrónico'" 
                                [maxlength]="50"
                                formControlName="mail">
                            </app-input-text>
                            <app-input-text 
                                [label]="'Teléfono'" 
                                mask="(000) 000 0000*"
                                maxlength="20"
                                formControlName="telephone">
                            </app-input-text>
                        </div>
                    </div>
            
                    <div class="flex flex-col gap-2">
                        <text-type [text]="'Contraseña'" [variant]="'secondary'"></text-type>
                        <app-input-text 
                            [label]="'Contraseña Actual'" 
                            [type]="'password'"
                            [maxlength]="20"
                            formControlName="oldPass">
                        </app-input-text>
                    </div>
            
                    <div class="flex flex-col gap-2 w-full">
                        <div class="flex flex-grow gap-4 w-full">
                            <app-input-text 
                                class="w-full"
                                [label]="'Contraseña Nueva'" 
                                [type]="'password'" 
                                [maxlength]="20" 
                                formControlName="newPass">
                            </app-input-text>
                            <app-input-text 
                                class="w-full"
                                [label]="'Confirmar Contraseña'" 
                                [type]="'password'" 
                                [maxlength]="20" 
                                formControlName="confirmPass">
                            </app-input-text>
                        </div>
                    </div>
                </form>
                <div class="flex justify-end flex-grow gap-4">
                    <action-button 
                        [text]="'Cerrar'" 
                        [variant]="'secondary'"
                        (click)="closeModal()">
                    </action-button>
                    <action-button 
                        [text]="'Guardar'"
                        (click)="getDataForm()">
                    </action-button>
                </div>
            </div>
            
        </div>
    </div>
</app-modal-content>
