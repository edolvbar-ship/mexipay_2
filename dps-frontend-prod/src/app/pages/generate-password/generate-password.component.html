<div class="h-1">
</div>
<div class="max-w-xl mx-auto px-12 select-none">
    <div class="content-center flex flex-col">
        <div class="mb-12">
        <text-title text="Crear nueva contraseña" size="xlarge" variant="primary">
        </text-title>
        <text-type
            text="La nueva contraseña debe de incluir al menos una mayúscula, un número y un caracter especial."
            size="xlarge"
            variant="primary"
            class="text-center"
        >
        </text-type>
        </div>
        <div>
        <!-- <input-login-form
            text="h-9"
            placeholder="text"
            >
        </input-login-form>
        <input-login-form></input-login-form> -->
        <div class="flex flex-col">
            <div class="top-0 mb-12">
            <label class="h-full flex items-center mb-6">
                <text-type text="Nueva contraseña" size="xlarge" variant="primary">
                </text-type>
            </label>
            <div class="relative">
                <input 
                [(ngModel)]="newPassword"
                [type]="passwordTypeNew"
                class="block h-full rounded-t-lg pl-10 pr-4 py-2 w-full text-base text-black border-0 border-b-2 border-gray appearance-none focus:outline-none focus:ring-0 focus:border-primary"
                placeholder="Ingresa tu nueva contraseña"
                />
                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                <i class="pi pi-lock"></i>
                </span>
                <span
                (click)="togglePasswordVisibility(1)"
                class="absolute inset-y-0 right-0 flex items-center pr-3 text-black"
                >
                <i class="pi pi-eye-slash"></i>
                </span>
            </div>
            </div>
            <div class="bottom-0 mb-12">
            <label class="h-full flex items-center mb-6">
                <text-type text="Confirmar nueva contraseña" size="xlarge" variant="primary">
                </text-type>
            </label>
            <div class="relative">
                <input
                [(ngModel)]="confirmPassword"
                [type]="passwordTypeConfirm"
                class="block h-full rounded-t-lg px-10 py-2 w-full text-base text-black border-0 border-b-2 border-gray appearance-none focus:outline-none focus:ring-0 focus:border-primary"
                placeholder="Ingresa tu contraseña"
                />
                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                    <i class="pi pi-lock"></i>
                </span>
                <span
                (click)="togglePasswordVisibility(2)"
                class="absolute inset-y-0 right-0 flex items-center pr-3 text-black"
                >
                <i class="pi pi-eye-slash"></i>
                </span>
            </div>
            </div>
        </div>
        </div>
        <div>
        <default-button
            (click)="validatePassword()"
            text="Guardar">
        </default-button>
        </div>
    </div>
</div>
