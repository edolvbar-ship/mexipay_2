<div class="mb-7">
    <text-title
        text="Tarjetas"
        size="large" 
        variant="primary">
    </text-title>
    <div class="flex flex-col md:flex-row md:justify-between space-y-4 md:space-y-0 md:space-x-4">
        <text-type
            text="Prefijos por banco emisor" 
            size="large" 
            variant="primary">
        </text-type>
        <div class="flex gap-6">
            <a routerLink="/tarjetas/create" *ngIf="canCreate">
                <action-button
                [text]="'Nuevo'"
                [linkIcon]="'PLUS_CIRCLE'"/>
            </a>
            <a routerLink="/tarjetas/upload" *ngIf="canCreate && canEdit">
                <action-button
                [text]="'Archivo'"
                [linkIcon]="'FILE'"/>
            </a>
        </div>
    </div>
</div>
<card-container>
    <table-layout 
        [dataTable]="binesData"
        [actions]="actions" 
        [showActions]="true" 
        [actionsColumnIndex]="2"
        [filter]="true"
    >    
    </table-layout>
</card-container>

<modal-confirm
  (accept)="handleReject()" 
  (reject)="handleAccept()">
</modal-confirm>
