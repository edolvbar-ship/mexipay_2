    # Add this error page for better 502 debugging
    location = /502_debug.json {
        add_header Content-Type application/json;
        return 200 '{"status":"backend_unavailable","message":"Cannot connect to backend service","timestamp":"$time_iso8601"}';
    }

    # MAIN SPA FALLBACK - ONLY ONE OF THESE!
    location / {
        # Block malicious agents
        if ($blocked_agent) {
            add_header Content-Type application/json always;
            access_log /var/log/nginx/pci_blocked.log detailed_full;
            return 405 '{"error":"Forbidden","message":"Access denied"}';
        }

        # Block malicious referers
        if ($blocked_referer) {
            access_log /var/log/nginx/pci_blocked.log detailed_full;
            return 444;
        }

        # Block malicious methods
        if ($blocked_method) {
            access_log /var/log/nginx/pci_blocked.log detailed_full;
            add_header Content-Type application/json always;
            return 405 '{"error":"Method Not Allowed"}';
        }
        # Root directive for the entire server
        root /var/app/current/dist/Mexipay/browser;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        add_header X-Debug-Fallback "Matched: $uri" always;  # Temporary for debugging

        # Security headers for SPA
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Route "SPA Fallback" always;

        limit_req zone=mylimit burst=150 nodelay;
    }

    # Static Assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/app/current/dist/Mexipay/browser;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Error pages
    error_page 403 /pci_403.json;
    error_page 404 /pci_404.json;
    error_page 500 502 503 504 /pci_500.json;
}
