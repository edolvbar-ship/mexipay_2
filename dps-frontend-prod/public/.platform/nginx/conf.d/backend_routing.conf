    # ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←
    # =============================================================================
    # RESUMEN DE MOVIMIENTOS – Soporta respuestas gigantes (hasta 15 minutos)
