        proxy_pass http://backend_admin;
        proxy_set_header X-Service-Group service1;

        # Timeout alto – el endpoint puede tardar varios minutos
        proxy_connect_timeout       10s;
        proxy_send_timeout          900s;   # 15 minutos máximo
        proxy_read_timeout          900s;   # 15 minutos máximo

        # CRÍTICO: streaming puro – nunca guarda toda la respuesta en memoria
        proxy_buffering             off;
        proxy_request_buffering     off;

        # Desactiva gzip en respuestas gigantes
        gzip off;

        # CORS completo
        add_header Access-Control-Allow-Origin      "*" always;
        add_header Access-Control-Allow-Methods      "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers      "Authorization,Content-Type,X-Request-ID,X-Service-Group,X-Auth,X-Time,commerce-name,commerce-id,mcc" always;
        add_header Access-Control-Expose-Headers     "Content-Disposition" always;

        # Preflight OPTIONS
        if ($request_method = OPTIONS) {
           add_header Access-Control-Max-Age 86400;
           return 204;
        }

