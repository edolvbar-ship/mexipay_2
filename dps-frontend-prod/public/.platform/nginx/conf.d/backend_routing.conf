# backend_routing.conf - WITH DNS RESOLUTION

# DNS Resolver for dynamic upstream resolution
resolver 10.0.0.2 valid=30s;  # VPC DNS resolver
resolver_timeout 5s;

# Shared memory zones for upstream DNS resolution
upstream backend_admin {
    zone backend_admin 64k;
    server awseb--awseb-qkhqx9jxxbbu-9aec1c0f2bd3afef.elb.us-east-2.amazonaws.com:80 max_fails=2 fail_timeout=10s resolve; # admin 3000
}
upstream backend_payment {
    zone backend_payment 64k;
    server awseb--AWSEB-0DheDTVlZ5OA-9fb5362fb906ccc5.elb.us-east-2.amazonaws.com:80 max_fails=2 fail_timeout=10s resolve; # payemnts 3001
}

upstream backend_heavy {
    zone backend_heavy 64k;
    server awseb--AWSEB-CsT4pOvjjMzk-c5d2116f8ae28169.elb.us-east-2.amazonaws.com:80 max_fails=2 fail_timeout=10s resolve; # heavy 3002
}


# PCI DSS 4.0 Req 10: Detailed Logging Format
log_format detailed_full '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'server_name=$server_name host=$host '
                          'request_id=$request_id '
                          'request_length=$request_length '
                          'time_iso8601=$time_iso8601 '
                          'request_time=$request_time '
                          'upstream_addr=$upstream_addr '
                          'upstream_status=$upstream_status '
                          'upstream_response_time=$upstream_response_time';

log_format request_body 'Request: $request, Body: $request_body';

# PCI DSS 4.0 Req 6.5.1: Security Mapping
map $http_user_agent $blocked_agent {
    default 0;
    "~*(sqlmap|nmap|nikto|masscan|burpsuite|acunetix)" 1;
}

map $request_method $blocked_method {
    default 0;
    ~^(TRACE|CONNECT|DEBUG)$ 1;
}

map $http_referer $blocked_referer {
    default 0;
    ~*(poker|porn|casino|replica) 1;
}

map $request_uri $malicious_pattern {
    default 0;
    "~*(\.\./|\.\.\\|union.*select|alert\(|javascript:)" 1;
}

# Rate Limiting - PCI DSS 4.0 Req 6.4
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

# Gzip Configuration
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css;


# ✅ Define proxy headers ONCE here - applies to all locations
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Request-ID $request_id;

# ✅ CRITICAL: Forward Authorization header for JWT tokens
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Original-Authorization $http_authorization;

# ✅ Forward custom headers
proxy_set_header X-Auth $http_x_auth;
proxy_set_header X-Time $http_x_time;
proxy_set_header commerce-name $http_commerce_name;
proxy_set_header commerce-id $http_commerce_id;
proxy_set_header mcc $http_mcc;

# ✅ Forward standard headers
proxy_set_header User-Agent $http_user_agent;
proxy_set_header Accept-Encoding $http_accept_encoding;
proxy_set_header Accept $http_accept;
proxy_set_header Content-Type $http_content_type;


# Main application server
server {
    listen 80;
    server_name _;

    # Logging configuration
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/access_detailed_full.log detailed_full;
    error_log /var/log/nginx/error.log debug;

    # Global security headers (PCI DSS Req 6)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Powered-By "Mexipay DPS";
    add_header X-Author "Desarrollo Mexipay";
    add_header X-Contact "desarrollo@mexipay.mx";

    # PCI Req 7.2: Block sensitive files and directories
    location ~* \.(env|git|svn|htaccess|htpasswd|ini|log|sh|sql|conf|config|bak|backup|old|tmp|temp|key|pem|crt|csr)$ {
        access_log /var/log/nginx/pci_sensitive_files.log detailed_full;
        add_header Content-Type application/json always;
        return 403 '{"error":"Forbidden","message":"Access denied"}';
    }

    # PCI Req 7.2: Block sensitive directories
    location ~* /(\.git|\.svn|\.well-known|config|admin|wp-admin|includes|etc|var|tmp|database|vendor|node_modules|\.env)/ {
        access_log /var/log/nginx/pci_sensitive_dirs.log detailed_full;
        add_header Content-Type application/json always;
        return 403 '{"error":"Forbidden","message":"Access denied"}';
    }

    # PCI Req 6.5.1: SQL Injection Protection
    location ~* "(union.*select|concat.*\(|drop.*table|insert.*into|delete.*from|update.*set|information_schema)" {
        access_log /var/log/nginx/pci_sql_blocked.log detailed_full;
        add_header Content-Type application/json always;
        return 403 '{"error":"Forbidden","message":"SQL injection attempt detected"}';
    }

    # PCI Req 6.5.7: XSS Protection
    location ~* "(<script|alert\(|onload=|onerror=|javascript:|vbscript:|base64,|expression\(|document\.|window\.)" {
        access_log /var/log/nginx/pci_xss_blocked.log detailed_full;
        add_header Content-Type application/json always;
        return 403 '{"error":"Forbidden","message":"XSS attempt detected"}';
    }

    # PCI Req 6.5.4: Path Traversal Protection
    location ~* "(\.\.\/|\.\.\\|etc\/passwd|proc\/|boot\.ini)" {
        access_log /var/log/nginx/pci_lfi_blocked.log detailed_full;
        add_header Content-Type application/json always;
        return 403 '{"error":"Forbidden","message":"Path traversal attempt detected"}';
    }

    # PCI Req 10: Custom Error Pages
    location = /pci_403.json {
        internal;
        access_log /var/log/nginx/pci_errors.log detailed_full;
        add_header Content-Type application/json always;
        return 200 '{"error":"Access Denied","message":"Security policy violation","timestamp":"$time_iso8601"}';
    }

    location = /pci_404.json {
        internal;
        access_log /var/log/nginx/pci_errors.log detailed_full;
        add_header Content-Type application/json always;
        return 200 '{"error":"Not Found","message":"Page was not found","timestamp":"$time_iso8601"}';
    }

    location = /pci_500.json {
        internal;
        access_log /var/log/nginx/pci_server_errors.log detailed_full;
        add_header Content-Type application/json always;
        return 200 '{"error":"Internal Server Error","message":"Please try again later","timestamp":"$time_iso8601"}';
    }

    # Health checks - FIXED: Make these EXACT matches
    location = /elb-health {
        access_log off;
        return 200 "healthy\n";
    }

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
    }

    location ~* ^/gateway/api/v2/ {
        # internal;
        access_log /var/log/nginx/auth_debug.log detailed_full;

        # Enhanced debugging
        add_header X-Proxied-By "Auth-Debug-Router" always;
        add_header X-Service-Group "service1" always;
        add_header X-Upstream "backend_admin" always;
        add_header X-Debug-Matched "AUTH-DEBUG-ROUTE" always;

