# Complete Proxy Configuration for Node.js Backend
server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/backend_access.log main;
    error_log /var/log/nginx/backend_error.log warn;

    client_max_body_size 50M;
    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;

    client_body_timeout 120s;
    client_header_timeout 120s;

    location /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","service":"nginx-proxy"}';
    }

    location /debug/headers {
        add_header Content-Type application/json;
        return 200 '{"authorization_received": "$http_authorization", "x_auth_received": "$http_x_auth"}';
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;

        proxy_connect_timeout 240s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Auth $http_x_auth;
        proxy_set_header X-Time $http_x_time;
        proxy_set_header commerce-name $http_commerce_name;
        proxy_set_header commerce-id $http_commerce_id;
        proxy_set_header mcc $http_mcc;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID,X-Auth,X-Time,commerce-name,commerce-id,mcc" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type text/plain;
            return 204;
        }
    }
}