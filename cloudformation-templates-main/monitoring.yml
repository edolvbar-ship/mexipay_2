        }

  PCISecurityMonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: HasWAF
    Properties:
      DashboardName: !Sub '${Environment}-PCI-Security-Monitoring'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# PCI DSS Security Monitoring - ${Environment}\n**Comprehensive security visibility for payment card data protection**"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 2,
              "width": 6,
              "height": 3,
              "properties": {
                "metrics": [
                  [ "AWS/WAFV2", "BlockedRequests", "WebACL", "${WAFWebACLId}", "Region", "${AWS::Region}", { "stat": "Sum", "period": 60 } ]
                ],
                "view": "singleValue",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Total Blocked Requests (1h)",
                "period": 60,
                "stat": "Sum"
              }
            },
            {
              "type": "metric",
              "x": 6,
              "y": 2,
              "width": 6,
              "height": 3,
              "properties": {
                "metrics": [
                  [ "AWS/WAFV2", "AllowedRequests", "WebACL", "${WAFWebACLId}", "Region", "${AWS::Region}", { "stat": "Sum", "period": 60 } ]
                ],
                "view": "singleValue",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Total Allowed Requests (1h)",
                "period": 60,
                "stat": "Sum"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 2,
              "width": 6,
              "height": 3,
              "properties": {
                "metrics": [
                  [ "AWS/WAFV2", "BlockedRequests", "WebACL", "${WAFWebACLId}", "Region", "${AWS::Region}", { "stat": "Sum", "period": 60 } ],
                  [ "AWS/WAFV2", "AllowedRequests", "WebACL", "${WAFWebACLId}", "Region", "${AWS::Region}", { "stat": "Sum", "period": 60 } ]
                ],
                "view": "pie",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Block vs Allow Ratio",
                "period": 60,
                "stat": "Sum"
              }
            },
            {
              "type": "metric",
              "x": 18,
              "y": 2,
              "width": 6,
              "height": 3,
              "properties": {
                "metrics": [
                  [ "AWS/WAFV2", "CountedRequests", "WebACL", "${WAFWebACLId}", "Region", "${AWS::Region}", { "stat": "Sum", "period": 60 } ]
                ],
                "view": "singleValue",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Rate Limiting Events (1h)",
                "period": 60,
                "stat": "Sum"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 5,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/WAFV2", "BlockedRequests", "WebACL", "${WAFWebACLId}", "Region", "${AWS::Region}", { "label": "WAF Blocks" } ]
                ],
                "view": "timeSeries",
                "stacked": true,
                "region": "${AWS::Region}",
                "title": "WAF Blocked Requests Over Time",
                "period": 300,
                "stat": "Sum"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 5,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/WAFV2", "AllowedRequests", "WebACL", "${WAFWebACLId}", "Region", "${AWS::Region}", { "label": "WAF Allowed" } ]
                ],
                "view": "timeSeries",
                "stacked": true,
                "region": "${AWS::Region}",
                "title": "WAF Allowed Requests Over Time",
                "period": 300,
                "stat": "Sum"
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 11,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "## PCI DSS Compliance Status\n| Requirement | Status | Last Check |\n|-------------|--------|------------|\n| WAF Protection | ? Compliant | Now |\n| Database Encryption | ? Compliant | Now |\n| Access Control | ? Compliant | Now |\n| Logging & Monitoring | ? Compliant | Now |\n| Network Security | ? Compliant | Now |"
              }
            }
          ]
        }

  # =============================================================================
  # IAM ROLES
  # =============================================================================

  XRayServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 'xray.amazonaws.com'
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess'
      Policies:
        - PolicyName: XRayAdditionalPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                  - 'xray:GetSamplingRules'
                  - 'xray:GetSamplingTargets'
                  - 'xray:GetServiceGraph'
                  - 'xray:GetTraceGraph'
                  - 'xray:GetTraceSummaries'
                Resource: '*'
      RoleName: !Sub 'mexipay-${Environment}-xray-service-role'

  CloudWatchAgentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'mexipay-${Environment}-cloudwatch-agent-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'cloudwatch:PutMetricData'
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
              - 'logs:DescribeLogStreams'
              - 'ec2:DescribeInstances'
              - 'ec2:DescribeTags'
            Resource: '*'

  MonitoringLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/elasticbeanstalk/${Environment}/monitoring'
      RetentionInDays: 30

Outputs:
  AlertSNSTopicArn:
    Description: 'ARN of the SNS topic for alerts'
    Value: !Ref AlertSNSTopic
    Export:
      Name: !Sub '${AWS::StackName}-AlertSNSTopicArn'

  MonitoringDashboardUrl:
    Description: 'URL of the CloudWatch monitoring dashboard'
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=mexipay-${Environment}-monitoring-dashboard'

  PCISecurityMonitoringDashboardUrl:
    Description: 'URL of the PCI Security monitoring dashboard'
    Value: !If [HasWAF, !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Environment}-PCI-Security-Monitoring', 'Not Created']

  BusinessMetricsDashboardUrl:
    Description: 'URL of the Business Metrics dashboard'
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=mexipay-${Environment}-business-metrics'

  OperationalHealthDashboardUrl:
    Description: 'URL of the Operational Health dashboard'
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=mexipay-${Environment}-operational-health'

  XRayServiceRoleArn:
    Description: 'ARN of the X-Ray service role'
    Value: !GetAtt XRayServiceRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-XRayServiceRoleArn'

  MonitoringLogGroupName:
    Description: 'Name of the monitoring log group'
    Value: !Ref MonitoringLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-MonitoringLogGroupName'

  CloudWatchAgentPolicyArn:
    Description: 'ARN of the CloudWatch Agent managed policy'
    Value: !Ref CloudWatchAgentPolicy
    Export:
      Name: !Sub '${AWS::StackName}-CloudWatchAgentPolicyArn'
