                  [ "AWS/RDS", "DiskQueueDepth", "DBInstanceIdentifier", "DB-RDS", { "label": "Disk Queue Depth" } ],
                  [ "AWS/RDS", "NetworkReceiveThroughput", "DBInstanceIdentifier", "DB-RDS", { "label": "Network RX" } ],
                  [ "AWS/RDS", "NetworkTransmitThroughput", "DBInstanceIdentifier", "DB-RDS", { "label": "Network TX" } ]
                ],
                "view": "timeSeries",
